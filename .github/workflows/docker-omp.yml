name: Build OMP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
            binary: omp-linux-x64
            native_targets: linux-x64-baseline linux-x64-modern

          - os: macos-15-intel
            target: darwin-x64
            binary: omp-darwin-x64
            native_targets: darwin-x64-baseline

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native addons
        uses: ./.github/actions/build-native
        with:
          platform: ${{ runner.os == 'Linux' && 'linux' || 'darwin' }}
          arch: x64

      - name: Build binary
        env:
          RELEASE_TARGETS: ${{ matrix.target }}
        run: bun run ci:release:build-binaries

      - name: Test binary
        shell: bash
        run: |
          chmod +x packages/coding-agent/binaries/${{ matrix.binary }}
          packages/coding-agent/binaries/${{ matrix.binary }} --version

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: packages/coding-agent/binaries/${{ matrix.binary }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
