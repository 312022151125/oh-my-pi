name: Build OMP2 macOS Intel v10 cached

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: OMP2 macOS Intel optimized x86_64
    runs-on: macos-15-intel
    timeout-minutes: 240

    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      OPUS_NO_PKG: "1"

      # Upstream OMP release policy: never pick up host/Homebrew PCRE2.
      # Otherwise /usr/local or /opt/homebrew install names can leak into
      # the shipped Mach-O executable.
      PCRE2_SYS_STATIC: "1"

      CARGO_INCREMENTAL: "1"

    steps:
      - name: Checkout OMP2
        uses: actions/checkout@v4
        with:
          repository: can1357/oh-my-pi
          ref: omp2
          fetch-depth: 1

      - name: Show environment
        shell: bash
        run: |
          set -euxo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "x86_64"
          sw_vers
          xcodebuild -version
          rustc -Vv
          cargo -V

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          brew install lld@22 uv zstd ninja

          LLD22="$(brew --prefix lld@22)/bin/ld64.lld"
          test -x "$LLD22"
          "$LLD22" --version | tee /tmp/lld-version.txt
          grep -q 'LLD 22\.' /tmp/lld-version.txt
          echo "LLD22=$LLD22" >> "$GITHUB_ENV"

      - name: Patch OMP2 for production Intel Python
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          fetch = Path("crates/py/scripts/fetch-python.sh")
          s = fetch.read_text()

          if "Darwin:x86_64)" not in s:
              anchor = "Linux:x86_64)"
              if anchor not in s:
                  raise SystemExit("Linux:x86_64 case not found; upstream layout changed")

              intel = '''Darwin:x86_64)
          prepare_tree "x86_64-apple-darwin" "freethreaded+debug" "python" "0"
          prepare_tree "x86_64-apple-darwin" "freethreaded+pgo+lto" "python-release" "1"
          ;;

          '''
              s = s.replace(anchor, intel + anchor, 1)

          old_flags = '''build_flags=$(case "$LIB_NAME" in *td) echo "Py_DEBUG,Py_GIL_DISABLED";; *) echo "Py_GIL_DISABLED";; esac)'''
          if old_flags in s:
              s = s.replace(old_flags, "build_flags=${BUILD_FLAGS}", 1)

              marker = '''echo "generating ${VENDOR_NAME}/pyo3-config.txt..." >&2'''
              if marker not in s:
                  raise SystemExit("pyo3 config marker not found; upstream layout changed")

              setup = '''local BUILD_FLAGS
          case "$LIB_NAME" in
          *td) BUILD_FLAGS="Py_DEBUG,Py_GIL_DISABLED" ;;
          *) BUILD_FLAGS="Py_GIL_DISABLED" ;;
          esac

          '''
              s = s.replace(marker, setup + marker, 1)

          fetch.write_text(s)

          shim = Path("crates/py/scripts/ld64.lld")
          t = shim.read_text()
          replacement = 'LLD="$(brew --prefix lld@22)/bin/ld64.lld"'

          candidates = (
              "LLD=/opt/homebrew/opt/lld/bin/ld64.lld",
              'LLD="/opt/homebrew/opt/lld/bin/ld64.lld"',
              "LLD=/usr/local/opt/lld/bin/ld64.lld",
              'LLD="/usr/local/opt/lld/bin/ld64.lld"',
          )

          if replacement not in t:
              for old in candidates:
                  if old in t:
                      t = t.replace(old, replacement, 1)
                      break
              else:
                  raise SystemExit("Unexpected ld64.lld layout; upstream changed")

          shim.write_text(t)
          PY

          chmod +x \
            crates/py/scripts/fetch-python.sh \
            crates/py/scripts/ld64.lld

          git diff --check
          git diff -- \
            crates/py/scripts/fetch-python.sh \
            crates/py/scripts/ld64.lld

      - name: Configure Intel release target
        shell: bash
        run: |
          set -euxo pipefail
          rustup target add x86_64-apple-darwin

          echo "CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS=-C link-arg=--ld-path=${LLD22} -Z threads=8" \
            >> "$GITHUB_ENV"

          echo "PYO3_CONFIG_FILE=${GITHUB_WORKSPACE}/vendor/python-release/pyo3-config.txt" \
            >> "$GITHUB_ENV"

      - name: Cache production embedded Python
        id: python-cache
        uses: actions/cache@v4
        with:
          path: |
            vendor/python
            vendor/python-release
          key: omp2-python-3.14.7-20260807-darwin-x64-pgo-lto
          restore-keys: |
            omp2-v9-python-3.14.7-20260807-darwin-x64-pgo-lto

      - name: Fetch embedded Python
        if: steps.python-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          crates/py/scripts/fetch-python.sh

      - name: Verify production Python
        shell: bash
        run: |
          set -euxo pipefail

          test -f vendor/python-release/pyo3-config.txt
          test -f vendor/python-release/PYTHON.json
          test -f vendor/python-release/stdlib.bin
          test -f vendor/python-release/needs-lld

          cat vendor/python-release/.archive.stamp
          grep -F \
            "cpython-3.14.7+20260807-x86_64-apple-darwin-freethreaded+pgo+lto-full" \
            vendor/python-release/.archive.stamp

          cat vendor/python-release/pyo3-config.txt
          grep -Fx 'build_flags=Py_GIL_DISABLED' \
            vendor/python-release/pyo3-config.txt
          ! grep -F 'Py_DEBUG' vendor/python-release/pyo3-config.txt
          ! grep -F ';; esac' vendor/python-release/pyo3-config.txt

          crates/py/scripts/ld64.lld --version 2>&1 | tee /tmp/shim-version.txt
          grep -q 'LLD 22\.' /tmp/shim-version.txt

      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: omp2-cargo-downloads-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            omp2-v9-cargo-downloads-${{ hashFiles('Cargo.lock') }}
            omp2-v8-cargo-downloads-${{ hashFiles('Cargo.lock') }}
            omp2-v6-cargo-downloads-${{ hashFiles('Cargo.lock') }}
            omp2-cargo-downloads-

      - name: Restore progressive target cache
        id: target-cache
        uses: actions/cache/restore@v4
        with:
          path: target
          key: omp2-v10-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-pgo-lto-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            omp2-v10-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-pgo-lto-
            omp2-v9-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-pgo-lto
            omp2-v9-target-${{ runner.os }}-${{ runner.arch }}-

      - name: Build production release
        id: cargo-build
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p ci-logs

          {
            echo "=== production build ==="
            echo "uname: $(uname -a)"
            echo "PYO3_CONFIG_FILE=$PYO3_CONFIG_FILE"
            echo "CMAKE_POLICY_VERSION_MINIMUM=$CMAKE_POLICY_VERSION_MINIMUM"
            echo "OPUS_NO_PKG=$OPUS_NO_PKG"
            echo "PCRE2_SYS_STATIC=$PCRE2_SYS_STATIC"
            echo "target_cache_matched_key=${{ steps.target-cache.outputs.cache-matched-key }}"
            echo "RUSTFLAGS=$CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS"
            "$LLD22" --version
          } | tee ci-logs/environment.txt

          set +e
          cargo build \
            --release \
            --locked \
            --target x86_64-apple-darwin \
            -p omp-app \
            --bin omp \
            2>&1 | tee ci-logs/cargo-build.log
          STATUS=${PIPESTATUS[0]}
          set -e

          echo "cargo_status=$STATUS" >> "$GITHUB_OUTPUT"
          exit "$STATUS"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omp2-darwin-x64-v10-build-log
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Show target cache size
        if: always()
        shell: bash
        run: |
          echo "=== target cache ==="
          du -sh target 2>/dev/null || true
          du -sh target/x86_64-apple-darwin/release 2>/dev/null || true

      - name: Save progressive target cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: target
          key: omp2-v10-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-pgo-lto-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Optimize and verify binary
        shell: bash
        run: |
          set -euxo pipefail

          SRC="target/x86_64-apple-darwin/release/omp"
          test -x "$SRC"

          mkdir -p dist
          cp "$SRC" dist/omp-darwin-x64
          BIN="dist/omp-darwin-x64"

          BEFORE="$(stat -f%z "$BIN")"

          echo "=== before final strip ==="
          ls -lh "$BIN"
          file "$BIN"
          lipo -archs "$BIN"

          file "$BIN" | grep -q "Mach-O 64-bit executable x86_64"
          lipo -archs "$BIN" | grep -Eq '(^|[[:space:]])x86_64($|[[:space:]])'

          # Safe Mach-O stripping: keep global CPython exports required by
          # native Python extensions.
          /usr/bin/strip -S -x "$BIN"

          AFTER="$(stat -f%z "$BIN")"

          echo "=== after final safe strip ==="
          ls -lh "$BIN"

          codesign --force --sign - "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

          "$BIN" --version

          {
            echo "before_bytes=$BEFORE"
            echo "after_bytes=$AFTER"
            echo "saved_bytes=$((BEFORE - AFTER))"
            echo "before_mib=$(awk -v n="$BEFORE" 'BEGIN {printf "%.2f", n/1048576}')"
            echo "after_mib=$(awk -v n="$AFTER" 'BEGIN {printf "%.2f", n/1048576}')"
            echo "saved_mib=$(awk -v n="$((BEFORE - AFTER))" 'BEGIN {printf "%.2f", n/1048576}')"
            echo
            echo "=== linked libraries ==="
            otool -L "$BIN"
          } | tee dist/size-report.txt

          echo "=== portability gate ==="
          OTOOL="$(otool -L "$BIN")"
          echo "$OTOOL"

          if echo "$OTOOL" | grep -Eq '/usr/local/opt/|/opt/homebrew/'; then
            echo "ERROR: non-portable Homebrew dylib dependency detected"
            exit 1
          fi

          if echo "$OTOOL" | grep -q 'libpcre2'; then
            echo "ERROR: PCRE2 is still dynamically linked; expected static PCRE2"
            exit 1
          fi

          shasum -a 256 "$BIN" > dist/omp-darwin-x64.sha256

      - name: Create compressed distribution
        shell: bash
        run: |
          set -euxo pipefail

          (
            cd dist

            tar -cf - \
              omp-darwin-x64 \
              omp-darwin-x64.sha256 \
              size-report.txt \
              | zstd -19 -T0 -o omp2-darwin-x64-v10.tar.zst

            shasum -a 256 omp2-darwin-x64-v10.tar.zst \
              > omp2-darwin-x64-v10.tar.zst.sha256

            ls -lh \
              omp-darwin-x64 \
              omp2-darwin-x64-v10.tar.zst \
              size-report.txt
          )

      - name: Upload optimized Intel package
        uses: actions/upload-artifact@v4
        with:
          name: omp2-darwin-x64-v10-cached-portable
          path: |
            dist/omp2-darwin-x64-v10.tar.zst
            dist/omp2-darwin-x64-v10.tar.zst.sha256
            dist/size-report.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
