name: Build OMP2 macOS Intel v4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: OMP2 macOS Intel x86_64
    runs-on: macos-15-intel
    timeout-minutes: 180

    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Checkout OMP2
        uses: actions/checkout@v4
        with:
          repository: can1357/oh-my-pi
          ref: omp2
          fetch-depth: 1

      - name: Show environment
        shell: bash
        run: |
          set -euxo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "x86_64"
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-path
          rustc -Vv
          cargo -V

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          brew install lld@22 uv zstd ninja

          LLD22="$(brew --prefix lld@22)/bin/ld64.lld"
          test -x "$LLD22"
          "$LLD22" --version
          "$LLD22" --version | grep -q 'LLD 22\.'

          echo "LLD22=$LLD22" >> "$GITHUB_ENV"

      # omp2 currently supports Darwin arm64 and Linux x86_64 in this script,
      # but python-build-standalone publishes the matching Darwin x86_64 tree.
      #
      # Deliberately create ONLY the non-LTO debug Python tree here.
      # Rust itself is still compiled with Cargo's release profile.
      # This avoids the unsupported Intel PGO+LTO/bitcode path while getting
      # a usable native Intel binary first.
      - name: Add Darwin x86_64 embedded Python
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("crates/py/scripts/fetch-python.sh")
          s = p.read_text()

          if "Darwin:x86_64)" not in s:
              anchor = "Linux:x86_64)"
              if anchor not in s:
                  raise SystemExit("Linux:x86_64 case not found; upstream layout changed")

              case = '''Darwin:x86_64)
          prepare_tree "x86_64-apple-darwin" "freethreaded+debug" "python" "0"
          ;;

          '''
              s = s.replace(anchor, case + anchor, 1)
              p.write_text(s)
          PY

          chmod +x crates/py/scripts/fetch-python.sh
          git diff --check
          git diff -- crates/py/scripts/fetch-python.sh

      - name: Configure explicit Intel target and linker
        shell: bash
        run: |
          set -euxo pipefail

          rustup target add x86_64-apple-darwin

          # OMP upstream routes the huge statically-linked CPython image through
          # lld on its supported macOS target. Do the same for Intel explicitly.
          echo "CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS=-C link-arg=--ld-path=${LLD22} -Z threads=8" \
            >> "$GITHUB_ENV"

          echo "PYO3_CONFIG_FILE=${GITHUB_WORKSPACE}/vendor/python/pyo3-config.txt" \
            >> "$GITHUB_ENV"

      - name: Cache Intel embedded Python
        id: python-cache
        uses: actions/cache@v4
        with:
          path: vendor/python
          key: omp2-v4-python-3.14.7-20260807-darwin-x64-debug

      - name: Fetch embedded Python
        if: steps.python-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          crates/py/scripts/fetch-python.sh

      - name: Verify embedded Python
        shell: bash
        run: |
          set -euxo pipefail

          test -f vendor/python/pyo3-config.txt
          test -f vendor/python/PYTHON.json
          test -f vendor/python/stdlib.bin
          test ! -f vendor/python/needs-lld

          echo "=== archive ==="
          cat vendor/python/.archive.stamp
          grep -F \
            "cpython-3.14.7+20260807-x86_64-apple-darwin-freethreaded+debug-full" \
            vendor/python/.archive.stamp

          echo "=== pyo3 config ==="
          cat vendor/python/pyo3-config.txt

          PY="$(awk -F= '$1=="executable" {print substr($0, index($0,"=")+1)}' vendor/python/pyo3-config.txt)"
          test -x "$PY"
          file "$PY"
          "$PY" --version

      # Cache registries only. Do NOT reuse target/ from earlier failed
      # ARM/Intel/PGO-LTO attempts.
      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: omp2-v4-cargo-downloads-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            omp2-v4-cargo-downloads-

      - name: Build Intel release
        id: cargo-build
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p ci-logs

          {
            echo "=== build environment ==="
            echo "uname: $(uname -a)"
            echo "LLD22: $LLD22"
            "$LLD22" --version
            echo "PYO3_CONFIG_FILE=$PYO3_CONFIG_FILE"
            echo "CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS=$CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS"
            echo
          } | tee ci-logs/environment.txt

          set +e
          cargo build \
            --release \
            --locked \
            --target x86_64-apple-darwin \
            -p omp-app \
            --bin omp \
            2>&1 | tee ci-logs/cargo-build.log

          STATUS=${PIPESTATUS[0]}
          set -e

          echo "cargo_status=$STATUS" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" -ne 0 ]; then
            echo "Cargo build failed with status $STATUS"
            exit "$STATUS"
          fi

      # Always upload the diagnostic log, even when Cargo fails.
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omp2-darwin-x64-v4-build-log
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify Intel binary
        shell: bash
        run: |
          set -euxo pipefail

          BIN="target/x86_64-apple-darwin/release/omp"
          test -x "$BIN"

          echo "=== binary ==="
          file "$BIN"
          lipo -archs "$BIN"

          file "$BIN" | grep -q "Mach-O 64-bit executable x86_64"
          lipo -archs "$BIN" | grep -Eq '(^|[[:space:]])x86_64($|[[:space:]])'

          echo "=== linked libraries ==="
          otool -L "$BIN"

          echo "=== smoke test ==="
          "$BIN" --version

      - name: Sign and package
        shell: bash
        run: |
          set -euxo pipefail

          BIN="target/x86_64-apple-darwin/release/omp"

          # Ad-hoc local signature; not Developer-ID notarization.
          codesign --force --sign - "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

          mkdir -p dist
          cp "$BIN" dist/omp-darwin-x64
          chmod +x dist/omp-darwin-x64

          (
            cd dist
            shasum -a 256 omp-darwin-x64 > omp-darwin-x64.sha256
            tar -czf omp2-darwin-x64-v4.tar.gz \
              omp-darwin-x64 \
              omp-darwin-x64.sha256
          )

          ls -lh dist/
          cat dist/omp-darwin-x64.sha256

      - name: Upload Intel binary
        uses: actions/upload-artifact@v4
        with:
          name: omp2-darwin-x64-v4
          path: |
            dist/omp-darwin-x64
            dist/omp-darwin-x64.sha256
            dist/omp2-darwin-x64-v4.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
