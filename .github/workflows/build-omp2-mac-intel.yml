name: Build OMP2 macOS Intel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-intel:
    name: OMP2 macOS Intel x86_64
    runs-on: macos-15-intel
    timeout-minutes: 180

    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Checkout OMP2
        uses: actions/checkout@v4
        with:
          repository: can1357/oh-my-pi
          ref: omp2
          fetch-depth: 1

      - name: Confirm Intel runner
        shell: bash
        run: |
          set -euxo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "x86_64"
          sw_vers
          rustc -Vv
          cargo -V

      # IMPORTANT:
      # OMP2's embedded release Python contains LLVM 22 LTO bitcode.
      # The upstream linker wrapper explicitly rejects any LLD major != 22.
      # Homebrew's unversioned `lld` is now LLD 23, so pin lld@22.
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          brew install lld@22 uv zstd ninja

          LLD22="$(brew --prefix lld@22)/bin/ld64.lld"
          test -x "$LLD22"

          echo "Homebrew prefix: $(brew --prefix)"
          echo "LLD22 prefix:    $(brew --prefix lld@22)"
          "$LLD22" --version

          "$LLD22" --version | grep -q "LLD 22\."

      - name: Patch OMP2 macOS Intel support
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          # 1) Upstream omp2 currently has no Darwin:x86_64 embedded-Python case.
          fetch = Path("crates/py/scripts/fetch-python.sh")
          text = fetch.read_text()

          if "Darwin:x86_64)" not in text:
              anchor = "Linux:x86_64)"
              if anchor not in text:
                  raise SystemExit(
                      "Unexpected fetch-python.sh layout: Linux:x86_64 case not found"
                  )

              intel_case = '''Darwin:x86_64)
          prepare_tree "x86_64-apple-darwin" "freethreaded+debug" "python" "0"
          prepare_tree "x86_64-apple-darwin" "freethreaded+pgo+lto" "python-release" "1"
          ;;

          '''
              text = text.replace(anchor, intel_case + anchor, 1)
              fetch.write_text(text)

          # 2) Upstream wrapper hard-codes Apple Silicon Homebrew path:
          #      /opt/homebrew/opt/lld/bin/ld64.lld
          #    Intel Homebrew uses /usr/local, and we specifically need lld@22.
          shim = Path("crates/py/scripts/ld64.lld")
          text = shim.read_text()

          replacement = 'LLD="$(brew --prefix lld@22)/bin/ld64.lld"'

          candidates = [
              "LLD=/opt/homebrew/opt/lld/bin/ld64.lld",
              'LLD="/opt/homebrew/opt/lld/bin/ld64.lld"',
              "LLD=/usr/local/opt/lld/bin/ld64.lld",
              'LLD="/usr/local/opt/lld/bin/ld64.lld"',
          ]

          changed = False
          for old in candidates:
              if old in text:
                  text = text.replace(old, replacement, 1)
                  changed = True
                  break

          if not changed and replacement not in text:
              raise SystemExit(
                  "Unexpected crates/py/scripts/ld64.lld layout; "
                  "refusing to patch the wrong line"
              )

          shim.write_text(text)
          PY

          chmod +x \
            crates/py/scripts/fetch-python.sh \
            crates/py/scripts/ld64.lld

          git diff --check
          echo "===== Local Intel patches ====="
          git diff -- \
            crates/py/scripts/fetch-python.sh \
            crates/py/scripts/ld64.lld

      - name: Verify patched LLD wrapper
        shell: bash
        run: |
          set -euxo pipefail

          OUT="$(crates/py/scripts/ld64.lld --version 2>&1)"
          echo "$OUT"
          echo "$OUT" | grep -q "LLD 22\."

      - name: Verify Intel Python archives
        shell: bash
        run: |
          set -euxo pipefail

          BASE="https://github.com/astral-sh/python-build-standalone/releases/download/20260807"

          curl --retry 4 --retry-all-errors -fsSIL \
            "$BASE/cpython-3.14.7+20260807-x86_64-apple-darwin-freethreaded+debug-full.tar.zst" \
            >/dev/null

          curl --retry 4 --retry-all-errors -fsSIL \
            "$BASE/cpython-3.14.7+20260807-x86_64-apple-darwin-freethreaded+pgo+lto-full.tar.zst" \
            >/dev/null

      # New cache namespace: do not reuse v2 trees/build artifacts.
      - name: Cache embedded Python
        id: python-cache
        uses: actions/cache@v4
        with:
          path: |
            vendor/python
            vendor/python-release
          key: omp2-python-darwin-x64-v3-cpython-3.14.7-pbs-20260807

      - name: Prepare embedded Python
        if: steps.python-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          crates/py/scripts/fetch-python.sh

      - name: Verify embedded Python trees
        shell: bash
        run: |
          set -euxo pipefail

          test -f vendor/python/pyo3-config.txt
          test -f vendor/python-release/pyo3-config.txt
          test -f vendor/python-release/needs-lld

          echo "===== Debug Python stamp ====="
          cat vendor/python/.archive.stamp

          echo "===== Release Python stamp ====="
          cat vendor/python-release/.archive.stamp

          grep -F \
            "x86_64-apple-darwin-freethreaded+debug-full" \
            vendor/python/.archive.stamp

          grep -F \
            "x86_64-apple-darwin-freethreaded+pgo+lto-full" \
            vendor/python-release/.archive.stamp

          echo "===== Release PyO3 config ====="
          cat vendor/python-release/pyo3-config.txt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: omp2-cargo-darwin-x64-v3-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            omp2-cargo-darwin-x64-v3-

      - name: Build production release
        shell: bash
        env:
          # Upstream defaults to vendor/python (debug). Release must explicitly
          # use the PGO+LTO tree, whose build requires exactly LLD 22.
          PYO3_CONFIG_FILE: ${{ github.workspace }}/vendor/python-release/pyo3-config.txt
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          set -euxo pipefail

          echo "PYO3_CONFIG_FILE=$PYO3_CONFIG_FILE"
          test -f "$PYO3_CONFIG_FILE"

          # Confirm the wrapper still resolves LLD 22 immediately before link.
          crates/py/scripts/ld64.lld --version 2>&1 | tee /tmp/lld-version.txt
          grep -q "LLD 22\." /tmp/lld-version.txt

          cargo build \
            --release \
            --locked \
            -p omp-app \
            --bin omp

      - name: Verify release binary
        shell: bash
        run: |
          set -euxo pipefail

          BIN="target/release/omp"
          test -x "$BIN"

          echo "===== file ====="
          file "$BIN"
          file "$BIN" | grep -q "Mach-O 64-bit executable x86_64"

          echo "===== lipo ====="
          ARCHS="$(lipo -archs "$BIN")"
          echo "$ARCHS"
          echo "$ARCHS" | grep -Eq '(^|[[:space:]])x86_64($|[[:space:]])'

          echo "===== version ====="
          "$BIN" --version

      - name: Sign and package
        shell: bash
        run: |
          set -euxo pipefail

          BIN="target/release/omp"

          # Local/ad-hoc signature. This is not Apple Developer ID notarization.
          codesign --force --sign - "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

          mkdir -p dist/omp2-darwin-x64
          cp "$BIN" dist/omp2-darwin-x64/omp
          chmod +x dist/omp2-darwin-x64/omp

          (
            cd dist
            tar -czf omp2-darwin-x64.tar.gz omp2-darwin-x64
            shasum -a 256 omp2-darwin-x64.tar.gz \
              > omp2-darwin-x64.tar.gz.sha256
          )

          ls -lh dist/omp2-darwin-x64.tar.gz
          cat dist/omp2-darwin-x64.tar.gz.sha256

      - name: Upload macOS Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: omp2-darwin-x64-v3
          path: |
            dist/omp2-darwin-x64.tar.gz
            dist/omp2-darwin-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
