name: Build OMP x64

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-x64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Build linux-x64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      - name: Cache Bun
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-linux-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-linux-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install native addons
        uses: ./.github/actions/native-artifacts
        with:
          targets: linux-x64-baseline linux-x64-modern

      - name: Build linux-x64
        env:
          RELEASE_TARGETS: linux-x64
        run: bun run ci:release:build-binaries

      - name: Test binary
        run: |
          chmod +x packages/coding-agent/binaries/omp-linux-x64
          packages/coding-agent/binaries/omp-linux-x64 --version

      - name: Upload linux-x64
        uses: actions/upload-artifact@v7
        with:
          name: omp-linux-x64
          path: packages/coding-agent/binaries/omp-linux-x64
          compression-level: 0


  macos:
    name: Build darwin-x64
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      - name: Cache Bun
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-macos-x64-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-macos-x64-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native addon
        uses: ./.github/actions/bazel-natives
        with:
          targets: darwin-x64-baseline
          cache-scope: build-darwin-x64

      - name: Build darwin-x64
        env:
          RELEASE_TARGETS: darwin-x64
        run: bun run ci:release:build-binaries

      - name: Test binary
        run: |
          chmod +x packages/coding-agent/binaries/omp-darwin-x64
          packages/coding-agent/binaries/omp-darwin-x64 --version

      - name: Upload darwin-x64
        uses: actions/upload-artifact@v7
        with:
          name: omp-darwin-x64
          path: packages/coding-agent/binaries/omp-darwin-x64
          compression-level: 0
